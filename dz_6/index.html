<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <div class="block active">
        <img class="photo" src="images/meadow.webp" alt="meadow">

        <div class="info">
            <div class="icon">
                <img src="images/person.svg" alt="person">
            </div>
            <span>Meadow</span>
        </div>
    </div>

    <div class="block">
        <img class="photo" src="images/ocean.webp" alt="ocean">

        <div class="info">
            <div class="icon">
                <img src="images/water.svg" alt="water">
            </div>
            <span>Ocean</span>
        </div>
    </div>

    <div class="block">
        <img class="photo" src="images/winter.webp" alt="winter">

        <div class="info">
            <div class="icon">
                <img src="images/snow.svg" alt="snow">
            </div>
            <span>Winter</span>
        </div>
    </div>

    <div class="block">
        <img class="photo" src="images/forest.webp" alt="forest">

        <div class="info">
            <div class="icon">
                <img src="images/tree.svg" alt="tree">
            </div>
            <span>Forest</span>
        </div>
    </div>

    <div class="block">
        <img class="photo" src="images/safari.webp" alt="safari">

        <div class="info">
            <div class="icon">
                <img src="images/sun.svg" alt="sun">
            </div>
            <span>Desert</span>
        </div>
    </div>

</div>


    <script src="app.js"></script>
</body>
</html>
